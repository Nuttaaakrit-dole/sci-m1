<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ N-NET วิทยาศาสตร์ ม.ต้น (ชุดที่ 5)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb; 
    --primary-dark: #1e40af;
    --primary-light: #eff6ff;
    --secondary: #7c3aed;
    --green: #059669; --green-light: #ecfdf5; --green-mid: #6ee7b7;
    --red: #dc2626; --red-light: #fef2f2; --red-mid: #fecaca;
    --amber-light: #fffbeb; --amber: #d97706;
    --gray-bg: #f1f5f9; --gray-card: #ffffff; --gray-border: #e2e8f0;
    --text: #1e293b; --text-muted: #64748b;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--gray-bg); color: var(--text); padding: 16px 8px; line-height: 1.6; }
  .container { max-width: 650px; margin: 0 auto; padding-bottom: 60px; }
  
  .header-card { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 30px 20px; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); text-align: center; }
  .header-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .header-card p { font-size: 15px; opacity: 0.9; }

  .card { background: var(--gray-card); border: 1px solid var(--gray-border); border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  
  .emoji-banner { font-size: 56px; text-align: center; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); animation: float 3s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .form-group { margin-bottom: 18px; text-align: left; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .form-control { width: 100%; padding: 14px; border: 2px solid var(--gray-border); border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 15px; transition: all 0.3s; }
  .form-control:focus { outline: none; border-color: var(--primary); background-color: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
  
  .progress-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); font-weight: 600; }
  .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; flex-grow: 1; margin: 0 15px; overflow: hidden; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 0%; transition: width 0.5s ease; }

  .question-text { font-size: 17px; font-weight: 600; margin-bottom: 22px; color: var(--text); line-height: 1.5; padding-left: 15px; border-left: 5px solid var(--secondary); }
  .hint-box { background: var(--amber-light); border-radius: 12px; padding: 14px; margin-bottom: 22px; font-size: 14px; color: #92400e; border: 1px solid #fde68a; }

  .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
  .option-item { display: flex; align-items: center; padding: 16px; border: 2px solid var(--gray-border); border-radius: 14px; cursor: pointer; transition: all 0.2s; background: white; }
  .option-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .option-item.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1); }
  
  .option-item.correct-reveal { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 600; }
  .option-item.wrong-reveal { border-color: var(--red); background: var(--red-light); color: var(--red); }
  .option-item.disabled { pointer-events: none; }

  .radio-dot { height: 20px; min-width: 20px; border: 2px solid #cbd5e1; border-radius: 50%; margin-right: 15px; position: relative; }
  .option-item.selected .radio-dot { border-color: var(--primary); }
  .option-item.selected .radio-dot::after { content: ''; position: absolute; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; top: 3px; left: 3px; }

  .rationale-box { padding: 16px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; border: 1px solid transparent; }
  .rationale-box.correct { background: var(--green-light); border-color: var(--green-mid); color: var(--green); }
  .rationale-box.wrong { background: var(--red-light); border-color: var(--red-mid); color: var(--red); }

  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
  .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-primary:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
  
  .nav-flex { display: flex; gap: 10px; margin-top: 10px; }
  .btn-nav { flex: 1; background: #f1f5f9; color: var(--text); border: 1px solid var(--gray-border); }

  .summary-card { text-align: center; border: 3px solid var(--primary) !important; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--primary); margin: 20px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .score-num { font-size: 36px; font-weight: 800; color: var(--primary); }
  
  .review-item { text-align: left; padding: 20px 0; border-bottom: 2px solid #f1f5f9; }
</style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <h1>สกร.โนนสัง ระดับมัธยมศึกษาตอนต้น</h1>
    <p>แบบทดสอบ N-NET วิชาวิทยาศาสตร์ (ชุดที่ 5: วิเคราะห์ขั้นสูง)</p>
  </div>
  <div id="quiz-app"></div>
</div>

<script>

      "answerOptions": [
        { "text": "ใส่ปูนขาวหรือดินมาร์ลในปริมาณที่เหมาะสมเพื่อสะเทินกรด", "rationale": "ถูกต้อง! การใช้ปูนขาว (Calcium hydroxide) เป็นเบสจะช่วยเพิ่มค่า pH ของดินให้เป็นกลางมากขึ้น", "isCorrect": true },
        { "text": "ใส่ปุ๋ยยูเรียเพิ่มขึ้นเพื่อให้พืชได้รับไนโตรเจนชดเชยค่ากรด", "rationale": "ผิด! การใส่ปุ๋ยเคมีบางชนิดต่อเนื่องจะยิ่งทำให้ดินเป็นกรดมากขึ้นกว่าเดิม", "isCorrect": false },
        { "text": "ปลูกพืชหมุนเวียนประเภทพืชไร่เพื่อดูดซับความเป็นกรดออก", "rationale": "ผิด! พืชไม่สามารถดูดซับความเป็นกรดออกจากดินได้โดยตรงในลักษณะนั้น", "isCorrect": false },
        { "text": "รดน้ำให้ปริมาณมากเป็นพิเศษเพื่อละลายกรดให้ไหลลงสู่ดินชั้นล่าง", "rationale": "ผิด! วิธีนี้ไม่ยั่งยืนและอาจทำให้สูญเสียหน้าดินและธาตุอาหารอื่นๆ ไปด้วย", "isCorrect": false }

    {

      ],
      "hint": "ตัวแปรต้นคือ 'เหตุ' หรือสิ่งที่นักวิจัยเปลี่ยนไปเพื่อดูผล"
    },

      "answerOptions": [

        "question": "ถ้านักศึกษาพบว่าน้ำในลำคลองมีลักษณะสีดำคล้ำและมีกลิ่นเหม็น ค่าดัชนีคุณภาพน้ำในข้อใดที่คาดว่าจะมีค่า 'ต่ำ' ผิดปกติ?",
        "answerOptions": [
          { "text": "ค่า DO (Dissolved Oxygen)", "rationale": "ถูกต้อง! DO คือปริมาณออกซิเจนที่ละลายในน้ำ น้ำเสียจะมีออกซิเจนต่ำมากจนสัตว์น้ำอยู่ไม่ได้", "isCorrect": true },
          { "text": "ค่า BOD (Biochemical Oxygen Demand)", "rationale": "ผิด! น้ำเสียจะมีค่า BOD สูง (เพราะจุลินทรีย์ต้องการออกซิเจนมากในการย่อยสลาย)", "isCorrect": false },
          { "text": "ค่าความขุ่น (Turbidity)", "rationale": "ผิด! น้ำเสียมักมีความขุ่นสูง ไม่ใช่ต่ำ", "isCorrect": false },
          { "text": "ปริมาณแบคทีเรียกลุ่มคอลิฟอร์ม", "rationale": "ผิด! น้ำเสียมักมีแบคทีเรียชนิดนี้สูงจากการปนเปื้อนสิ่งปฏิกูล", "isCorrect": false }
        ],
        "hint": "ปลาน้ำจืดจะตายเมื่อออกซิเจนในน้ำน้อยกว่า 2-3 mg/L"
      }
  ]
};

let state = {
  isStarted: false,
  studentName: '',
  studentId: '',
  questions: [],
  current: 0,
  answers: [],
  checked: []
};

function initQuiz() {
  state.questions = quizData.questions.map(q => ({
    ...q,
    answerOptions: [...q.answerOptions].sort(() => Math.random() - 0.5)
  })).sort(() => Math.random() - 0.5);
  
  state.current = 0;
  state.answers = new Array(state.questions.length).fill(null);
  state.checked = new Array(state.questions.length).fill(false);
}

function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const id = document.getElementById('input-id').value.trim();
  if (!name || !id) return alert('กรุณากรอกชื่อและรหัสให้ครบครับ');
  state.studentName = name;
  state.studentId = id;
  state.isStarted = true;
  initQuiz();
  render();
}

function render() {
  const app = document.getElementById('quiz-app');
  if (!state.isStarted) {
    app.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="emoji-banner">🔬 🧪 🧬 🌍</div>
        <h2 style="margin-bottom:20px;">ลงทะเบียนผู้เข้าสอบ</h2>
        <div class="form-group">
          <label>ชื่อ-นามสกุล</label>
          <input type="text" id="input-name" class="form-control" placeholder="ระบุชื่อ-นามสกุล">
        </div>
        <div class="form-group">
          <label>รหัสนักศึกษา</label>
          <input type="text" id="input-id" class="form-control" placeholder="ระบุเลขประจำตัว">
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">เริ่มทำข้อสอบ (ชุดที่ 5)</button>
      </div>
    `;
    return;
  }

  if (state.current >= state.questions.length) {
    renderSummary(app);
    return;
  }

  const q = state.questions[state.current];
  const pct = (state.current / state.questions.length) * 100;
  
  app.innerHTML = `
    <div class="card">
      <div class="progress-container">
        <span>ข้อที่ ${state.current + 1}/${state.questions.length}</span>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="question-text">${q.question}</div>
      <div class="hint-box">💡 <b>คำใบ้:</b> ${q.hint}</div>
      <div class="options-list">
        ${q.answerOptions.map((opt, i) => {
          let cls = 'option-item';
          if (state.answers[state.current] === i) cls += ' selected';
          if (state.checked[state.current]) {
            cls += ' disabled';
            if (opt.isCorrect) cls += ' correct-reveal';
            else if (state.answers[state.current] === i) cls += ' wrong-reveal';
          }
          return `<div class="${cls}" onclick="select(${i})"><span class="radio-dot"></span>${opt.text}</div>`;
        }).join('')}
      </div>
      ${state.checked[state.current] ? `
        <div class="rationale-box ${q.answerOptions[state.answers[state.current]].isCorrect ? 'correct' : 'wrong'}">
          ${q.answerOptions[state.answers[state.current]].rationale}
        </div>
      ` : ''}
      <div class="nav-flex">
        <button class="btn btn-nav" onclick="prev()" ${state.current === 0 ? 'disabled' : ''}>ย้อนกลับ</button>
        ${!state.checked[state.current] ? 
          `<button class="btn btn-primary" style="flex:2;margin:0;" onclick="check()" ${state.answers[state.current] === null ? 'disabled' : ''}>ส่งคำตอบ</button>` :
          `<button class="btn btn-primary" style="flex:2;margin:0;" onclick="next()">${state.current === state.questions.length - 1 ? 'ดูผลคะแนน' : 'ข้อถัดไป'}</button>`
        }
      </div>
    </div>
  `;
}

function renderSummary(app) {
  const score = state.questions.reduce((acc, q, i) => acc + (q.answerOptions[state.answers[i]]?.isCorrect ? 1 : 0), 0);
  app.innerHTML = `
    <div class="card summary-card">
      <h2>ใบรายงานผลสอบ</h2>
      <p>${state.studentName} (${state.studentId})</p>
      <div class="score-circle">
        <div class="score-num">${score}</div>
        <div style="font-size:14px;">คะแนน</div>
      </div>
      <p>${score >= 12 ? 'ยินดีด้วย! คุณผ่านเกณฑ์' : 'พยายามอีกครั้งนะครับ'}</p>
      <button class="btn btn-primary" onclick="location.reload()">ทำใหม่อีกครั้ง</button>
      <div style="margin-top:30px;">
        <h3>เฉลยคำตอบ</h3>
        ${state.questions.map((q, i) => `
          <div class="review-item">
            <b>ข้อ ${i+1}:</b> ${q.question}<br>
            <span style="color:${q.answerOptions[state.answers[i]].isCorrect ? 'green' : 'red'}">
              คุณตอบ: ${q.answerOptions[state.answers[i]].text}
            </span><br>
            <small>เฉลย: ${q.answerOptions.find(o => o.isCorrect).text}</small>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function select(i) { if (!state.checked[state.current]) { state.answers[state.current] = i; render(); } }
function check() { state.checked[state.current] = true; render(); }
function next() { state.current++; render(); }
function prev() { if (state.current > 0) { state.current--; render(); } }

render();
</script>
</body>
</html>
